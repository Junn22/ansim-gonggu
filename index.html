      '<button type="button" class="share-icon-btn" data-action="share-campaign" data-campaign="' + esc(campaignId) + '" aria-label="캠페인 공유">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle>' +
      '<line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>' +
      "</button>"
    );
  }
  function fmtWon(n) { return "₩" + Number(n || 0).toLocaleString("ko-KR"); }
  // deliveryType: "empty"(빈박스, +1,000원) / "real"(실배송, +0원) / null(단일 방식 캠페인 - 캠페인의 fee를 그대로 씀)
  function payout(c, quantity, deliveryType) {
    var q = quantity || 1;
    var tiers = c && c.quantity_prices;
    var base = (tiers && tiers.length >= q) ? tiers[q - 1] : (c.unit_price || 0) * q;
    var fee;
    if (deliveryType === "empty") fee = 1000;
    else if (deliveryType === "real") fee = 0;
    else fee = (c && c.fee) || 0;
    return (base || 0) + fee;
  }
  // 실배송/빈박스를 한 캠페인에서 함께 운영하는지 여부 (둘 다 목표 인원이 있으면 섞어서 운영)
  function isMixedDelivery(c) {
    return !!(c && Number(c.real_delivery_target) > 0 && Number(c.empty_box_target) > 0);
  }
  // 섞어서 운영하는 캠페인은 실배송/빈박스 배정 결과에 따라 지급액이 달라지므로,
  // 신청 전에는 "최소~최대" 범위로 보여준다. 그 외에는 기존처럼 확정 금액을 보여준다.
  function payoutRangeLabel(c, quantity) {
    if (isMixedDelivery(c)) {
      var lo = payout(c, quantity, "real");
      var hi = payout(c, quantity, "empty");
      return fmtWon(Math.min(lo, hi)) + " ~ " + fmtWon(Math.max(lo, hi));
    }
    return fmtWon(payout(c, quantity));
  }
  function deliveryTypeLabel(t) {
    return t === "empty" ? "빈박스" : (t === "real" ? "실배송" : "");
  }
  function todayISO() { return new Date().toISOString().slice(0, 10); }

  /* ================= 거래명세서 ================= */
  // "공급받는자"(우리 회사) 정보는 항상 고정.
  var OUR_COMPANY = { reg: "248-86-03694", name: "(주)케이제이브랜즈", ceo: "김병준", account: "우리은행 1005-904-908422" };
  // 참여자에게 지급하는 수수료(payout의 fee)와는 별개로, 캠페인을 의뢰한 업체에 청구하는 작업 수수료.
  var INVOICE_WORK_FEE = { empty: 1500, real: 500 };
  var INVOICE_EMPTY_BOX_AGENCY_FEE = 2200;
  var INVOICE_VAT_RATE = 0.1;

  // 캠페인이 단일 방식(빈박스만/실배송만)이면 개별 신청자에는 delivery_type이 안 남아있으므로
  // 캠페인의 fee 값(0원=실배송, 그 외=빈박스)으로 유추한다.
  function invoiceDeliveryType(c, a) {
    if (a.delivery_type === "real" || a.delivery_type === "empty") return a.delivery_type;
    return Number(c.fee) === 0 ? "real" : "empty";
  }
  // 아직 구매 전(배정확정만 된) 신청은 업체에 청구할 실적이 없으므로 제외한다.
  function invoiceBillable(a) {
    return a.status !== "assigned";
  }
  function invoiceLine(name, count, unitPrice) {
    var vat = Math.round(unitPrice * INVOICE_VAT_RATE);
    return { name: name, count: count, unit: "건", unitPrice: unitPrice, vat: vat, total: (unitPrice + vat) * count };
  }
  function computeInvoiceLines(c) {
    var billable = (c.applicants || []).filter(invoiceBillable);
    var lines = [];

    // 1) 상품 금액 — 신청 수량(가격이 달라지는 단위)별로 묶는다.
    var byQty = {}, qtyOrder = [];
    billable.forEach(function (a) {
      var q = a.quantity || 1;
      if (!byQty[q]) { byQty[q] = 0; qtyOrder.push(q); }
      byQty[q] += 1;
    });
    qtyOrder.sort(function (x, y) { return x - y; });
    qtyOrder.forEach(function (q) {
      var tiers = c.quantity_prices;
      var unit = (tiers && tiers.length >= q) ? tiers[q - 1] : (c.unit_price || 0) * q;
      var name = c.product + (c.option_name ? " · " + c.option_name : "") + (q > 1 ? " (" + q + "개)" : "");
      lines.push(invoiceLine(name, byQty[q], unit));
    });

    // 2) 작업 수수료 — 실배송/빈박스 여부별로 묶는다. 한 캠페인에 한 방식만 있으면 이름에 방식을 안 붙인다.
    var byType = { real: 0, empty: 0 };
    billable.forEach(function (a) { byType[invoiceDeliveryType(c, a)]++; });
    var mixedTypes = byType.real > 0 && byType.empty > 0;
    if (byType.real > 0) lines.push(invoiceLine(mixedTypes ? "작업 수수료(실배송)" : "작업 수수료", byType.real, INVOICE_WORK_FEE.real));
    if (byType.empty > 0) lines.push(invoiceLine(mixedTypes ? "작업 수수료(빈박스)" : "작업 수수료", byType.empty, INVOICE_WORK_FEE.empty));

    // 3) 빈박스 대행 — 빈박스로 진행된 건에만 붙는다.
    if (byType.empty > 0) lines.push(invoiceLine("빈박스 대행", byType.empty, INVOICE_EMPTY_BOX_AGENCY_FEE));

    return lines;
  }
  function splitInvoiceDate(dateStr) {
    var parts = String(dateStr || "").split("-");
    if (parts.length < 3) return { y: "", m: "", d: "" };
    return { y: parts[0].slice(2), m: String(Number(parts[1]) || ""), d: String(Number(parts[2]) || "") };
  }
  function fmtDateTime(iso) {
    try {
      var d = new Date(iso);
      return d.toLocaleString("ko-KR", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }) + " 입금 처리";
    } catch (e) { return iso; }
  }
  function fmtAppliedAt(iso) {
    try {
      var d = new Date(iso);
      var pad = function (n) { return String(n).padStart(2, "0"); };
      return String(d.getFullYear()).slice(2) + "." + pad(d.getMonth() + 1) + "." + pad(d.getDate()) + "." + pad(d.getHours()) + ":" + pad(d.getMinutes());
    } catch (e) { return iso; }
  }
  function defaultFarDeadline() {
    // 마감일 입력을 잠시 폼에서 숨겼기 때문에, "지금 마감" 버튼으로 직접 마감하는
    // 운영 방식을 그대로 쓸 수 있도록 넉넉히 먼 기본값을 자동으로 채워넣는다.
    var d = new Date();
    d.setFullYear(d.getFullYear() + 1);
    return d.toISOString().slice(0, 10);
  }
  function daysUntil(iso) {
    var target = new Date(iso + "T23:59:59");
    return Math.ceil((target - new Date()) / 86400000);
  }

  function toast(msg, kind) {

    setTimeout(function () { toasts = toasts.filter(function (t) { return t.id !== id; }); renderToasts(); }, 3600);

  function flattenApplicants(all) {
    return (all || []).reduce(function (acc, c) { return acc.concat((c.applicants || []).map(function (a) { return Object.assign({}, a, { campaign: c }); })); }, []);
  }

  // 은행 다계좌 이체는 한 파일에 15건까지만 올릴 수 있어서, 정산 대기 중인 신청자를
  // 캠페인 단위로 묶어 15건 내외의 파일 여러 개로 미리 나눠준다. 캠페인 하나가 중간에
  // 두 파일로 쪼개지지 않게 하되(오래된 캠페인부터 순서대로 채움), 한 캠페인 자체가
  // 15건을 넘으면 그 캠페인만 15건씩 끊어서 별도 파일로 만든다.
  function computeTransferBatches(all) {
    var byCampaign = {};
    var order = [];
    flattenApplicants(all).filter(isSettleEligible).forEach(function (a) {
      var cid = a.campaign.id;
      if (!byCampaign[cid]) { byCampaign[cid] = { campaign: a.campaign, list: [] }; order.push(cid); }
      byCampaign[cid].list.push(a);
    });
    var groups = order.map(function (cid) { return byCampaign[cid]; });
    groups.sort(function (x, y) { return new Date(x.campaign.created_at) - new Date(y.campaign.created_at); });

    var batches = [];
    var current = null;
    function pushCurrent() { if (current && current.count > 0) batches.push(current); current = null; }

    groups.forEach(function (g) {
      if (g.list.length > 15) {
        pushCurrent();
        for (var i = 0; i < g.list.length; i += 15) {
          var slice = g.list.slice(i, i + 15);
          batches.push({ groups: [{ campaign: g.campaign, list: slice }], count: slice.length });
        }
        return;
      }
      if (current && current.count + g.list.length > 15) pushCurrent();
      if (!current) current = { groups: [], count: 0 };
      current.groups.push(g);
      current.count += g.list.length;
    });
    pushCurrent();
    return batches;
  }

  // 한 파일(배치) 안에서 같은 계좌번호가 여러 번 나오면 이체 수수료를 아끼려고
  // 실제로는 한 번만 보내고 금액을 합친다. 신청 번호는 그대로 매겨서 어느
  // 캠페인에서 온 건지 추적할 수 있게 하고, 합쳐진 줄엔 표시를 해준다.
  // 계좌번호가 비어있으면(데이터 이상 등) 서로 합쳐지지 않도록 신청 순번을 붙여 고유하게 만든다.
  function accountKeyFor(a, rowNum) {
    return String((a && a.account) || "").trim() || ("__empty_" + rowNum);
  }
  function computeAccountDupMap(batch) {
    var rowNums = {}; // 계좌번호 -> 이 배치 안에서의 신청 순번들
    var rowNum = 0;
    batch.groups.forEach(function (g) {
      g.list.forEach(function (a) {
        rowNum++;
        var key = accountKeyFor(a, rowNum);
        (rowNums[key] || (rowNums[key] = [])).push(rowNum);
      });
    });
    return rowNums;
  }

  function renderTransferBatch(batch, bi) {
    var dupMap = computeAccountDupMap(batch);
    var rowNum = 0;
    // 그룹(캠페인)별 헤더 + 신청 단위 행 메타데이터를 먼저 만든다.
    var groupsMeta = batch.groups.map(function (g) {
      var header =
        '<tr><td colspan="5" style="padding:10px 8px 4px;font-weight:700;font-size:.82rem;color:var(--ink-soft);border-top:1px solid var(--line);">' +
        esc(g.campaign.product) + (g.campaign.option_name ? " · " + esc(g.campaign.option_name) : "") +
        ' <span style="font-weight:400;color:var(--ink-faint);">· ' + g.list.length + "건</span></td></tr>";
      var rows = g.list.map(function (a) {
        rowNum++;
        var key = accountKeyFor(a, rowNum);
        return { rowNum: rowNum, a: a, key: key, dupRows: dupMap[key], amt: payout(g.campaign, a.quantity, a.delivery_type) };
      });
      return { header: header, rows: rows };
    });
    // 계좌별 합산 금액 미리 계산
    var totals = {};
    groupsMeta.forEach(function (g) {
      g.rows.forEach(function (r) { totals[r.key] = (totals[r.key] || 0) + r.amt; });
    });
    var tableBody = groupsMeta.map(function (g) {
      var body = g.rows.map(function (r) {
        var isDup = r.dupRows.length > 1;
        var isFirst = isDup && r.dupRows[0] === r.rowNum;
        var amountCell;
        if (isFirst) {
          amountCell =
            '<div>' + fmtWon(totals[r.key]) + "</div>" +
            '<div style="font-size:.68rem;color:var(--accent);font-weight:600;margin-top:2px;">' + r.dupRows.length + "건 합산(" + r.dupRows.join(", ") + "번)</div>";
        } else if (isDup) {
          amountCell =
            '<div style="color:var(--ink-faint);text-decoration:line-through;">' + fmtWon(r.amt) + "</div>" +
            '<div style="font-size:.68rem;color:var(--ink-faint);margin-top:2px;">' + r.dupRows[0] + "번에 합산</div>";
        } else {
          amountCell = fmtWon(r.amt);
        }
        return (
          "<tr><td class=\"num\" style=\"color:var(--ink-faint);\">" + r.rowNum + "</td>" +
          "<td>" + esc(r.a.name) + (r.a.exported ? ' <span class="pill pill-reviewed" style="font-size:.68rem;">파일 생성됨</span>' : "") + "</td>" +
          "<td>" + esc(r.a.bank) + "</td>" +
          '<td class="num">' + esc(r.a.account) + "</td>" +
          '<td class="num">' + amountCell + "</td></tr>"
        );
      }).join("");
      return g.header + body;
    }).join("");
    var dupKeyCount = Object.keys(dupMap).filter(function (k) { return dupMap[k].length > 1; }).length;
    var actualTransferCount = Object.keys(dupMap).length;
    return (
      '<div class="card" style="padding:16px;margin-bottom:16px;">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;">' +
      '<h3 style="margin:0;">' + (bi + 1) + "차 파일 · 신청 " + batch.count + "건" + (dupKeyCount ? " · 실제 이체 " + actualTransferCount + "건" : "") + "</h3>" +
      '<button class="btn btn-primary btn-sm" data-action="download-transfer-batch" data-batch="' + bi + '">엑셀 다운로드</button>' +
      "</div>" +
      (dupKeyCount ? '<p style="font-size:.78rem;color:var(--accent);margin-bottom:8px;">같은 계좌번호로 ' + dupKeyCount + '명이 중복 신청돼 있어요. 이체 수수료를 아끼도록 금액을 합쳐서 한 번만 보내도록 표시했어요.</p>' : "") +
      '<div class="table-wrap"><table><thead><tr><th class="num">#</th><th>이름</th><th>은행</th><th class="num">계좌번호</th><th class="num">금액</th></tr></thead><tbody>' +
      tableBody +

      phone: (fd.get("phone") || "").toString().trim() || null,

    };
    var id = UI.editingClientId;
    setBusy(true);
    var req = id ? sb.from("clients").update(payload).eq("id", id) : sb.from("clients").insert(payload);
    req.then(function (res) {
      setBusy(false);
      if (res.error) {
        var dup = String(res.error.message || "").toLowerCase().indexOf("duplicate") !== -1;
        toast(dup ? "이미 등록된 상호예요. 목록에서 수정해주세요." : (res.error.message || "저장에 실패했어요."), "err");

  function downloadTransferBatch(bi) {
    var batches = computeTransferBatches(DATA.adminCampaigns);
    var batch = batches[bi];
    if (!batch) { toast("해당 파일을 찾을 수 없어요.", "err"); return; }
    // 같은 계좌번호는 한 줄로 합쳐서(금액 합산) 엑셀에 내보낸다 — 이체 수수료를 아끼기 위함.
    var order = [];
    var merged = {};
    var ids = [];
    var rowNum = 0;
    batch.groups.forEach(function (g) {
      g.list.forEach(function (a) {
        rowNum++;
        var key = accountKeyFor(a, rowNum);
        if (!merged[key]) { merged[key] = { bank: a.bank, account: a.account, amount: 0 }; order.push(key); }
        merged[key].amount += payout(g.campaign, a.quantity, a.delivery_type);
        ids.push(a.id);
      });
    });
    var rows = order.map(function (key) {
      var m = merged[key];
      return [m.bank, m.account, m.amount, "제품 구입비", "제품 구입비", ""];
    });
    var mergedCount = order.length < ids.length;
    var ws = XLSX.utils.aoa_to_sheet(rows);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
    var filename = todayISO().replace(/-/g, "") + "_다계좌이체_" + (bi + 1) + "차.xls";
    XLSX.writeFile(wb, filename, { bookType: "biff8" });
    markExported(ids).then(function () { loadAdminData(); });
    toast((bi + 1) + "차 파일을 다운로드했어요." + (mergedCount ? " (중복 계좌 합산 적용)" : ""));
  }

  function computeLedgerRows() {
    var applicants = flattenApplicants(DATA.adminCampaigns);
    var month = UI.ledgerMonth || new Date().toISOString().slice(0, 7);
    var status = UI.ledgerStatus === "all" ? "all" : "paid";
    var q = (UI.ledgerSearchQuery || "").trim().toLowerCase();
    var qDigits = q.replace(/\D/g, "");
    var rows = applicants.filter(function (a) {
      if (status === "paid") {
        if (!(a.status === "paid" && String(a.paid_at || "").slice(0, 7) === month)) return false;
      } else if (String(a.applied_at || "").slice(0, 7) !== month) {
        return false;
      }
      if (!q) return true;
      var nameMatch = (a.name || "").toLowerCase().indexOf(q) !== -1;
      var phoneDigits = String(a.phone || "").replace(/\D/g, "");
      var phoneMatch = qDigits ? phoneDigits.indexOf(qDigits) !== -1 : false;
      return nameMatch || phoneMatch;
    }).sort(function (x, y) {
      var kx = status === "paid" ? (x.paid_at || "") : (x.applied_at || "");
      var ky = status === "paid" ? (y.paid_at || "") : (y.applied_at || "");
      return String(ky).localeCompare(String(kx));
    });
    return { rows: rows, month: month, status: status };
  }

    var ledger = computeLedgerRows();
    var rows = ledger.rows, month = ledger.month, status = ledger.status;

      '<option value="paid"' + (status === "paid" ? " selected" : "") + '>입금완료만</option>' +
      '<option value="all"' + (status === "all" ? " selected" : "") + '>전체 상태</option>' +

      );
    }).join("");
    return (
      '<p style="font-size:.85rem;color:var(--ink-soft);margin:14px 0 4px;">' + month + " · " + rows.length + "건 · 합계 " + fmtWon(total) + "</p>" +
      (rows.length
        ? '<div class="table-wrap"><table><thead><tr><th class="num">#</th><th class="num">' + (status === "paid" ? "지급일" : "신청일시") + '</th><th>이름</th><th class="num">연락처</th><th>상품명</th><th class="num">주문번호</th><th class="num">지급액</th><th>계좌</th><th>상태</th></tr></thead><tbody>' + tableRows + "</tbody></table></div>"
        : '<div class="empty">' + ((UI.ledgerSearchQuery || "").trim() ? "검색 결과가 없어요." : "이 기간에 해당하는 기록이 없어요.") + "</div>")
    );
  }

  function fmtLedgerDate(iso) {
    if (!iso) return "—";
    try {
      var d = new Date(iso);
      var pad = function (n) { return String(n).padStart(2, "0"); };
      return String(d.getFullYear()).slice(2) + "." + pad(d.getMonth() + 1) + "." + pad(d.getDate());
    } catch (e) { return String(iso).slice(0, 10); }
  }

  function renderCampRow(c) {
    var open = campaignIsOpen(c);
    var expanded = !!UI.expanded[c.id];
    var filled = (c.applicants || []).length;
    var pendingCount = (c.applicants || []).filter(isSettleEligible).length;
    var paidCount = (c.applicants || []).filter(function (a) { return a.status === "paid"; }).length;
    var unpurchasedCount = (c.applicants || []).filter(function (a) { return a.status === "assigned"; }).length;
    var fullySettled = !pendingCount && paidCount > 0;
    var mixed = isMixedDelivery(c);
    var realCount = mixed ? (c.applicants || []).filter(function (a) { return a.delivery_type === "real"; }).length : 0;
    var emptyCount = mixed ? (c.applicants || []).filter(function (a) { return a.delivery_type === "empty"; }).length : 0;
    return (
      '<div class="camp-row">' +
      '<div class="camp-row-head" data-action="toggle-expand" data-campaign="' + c.id + '" role="button" tabindex="0" aria-expanded="' + (expanded ? "true" : "false") + '">' +
      (c.image_url ? '<img class="camp-row-thumb" src="' + esc(c.image_url) + '" alt="">' : "") +
      '<span class="pill pill-' + (open ? "recruiting" : "closed") + '">' + (open ? "모집중" : "마감") + "</span>" +
      (fullySettled
        ? '<div style="display:flex;flex-direction:column;align-items:flex-start;gap:3px;">' +
          '<span class="pill pill-paid">정산완료</span>' +
          (unpurchasedCount ? '<span class="warn-tag" style="font-size:.72rem;">미구매 ' + unpurchasedCount + "명</span>" : "") +
          "</div>"
        : "") +
      '<div class="name"><div class="p">' + esc(c.product) + (c.option_name ? ' <span style="font-weight:400;color:var(--ink-soft);">· ' + esc(c.option_name) + "</span>" : "") + '</div><div class="s">' + esc(c.seller) + " · 지급액 " + payoutRangeLabel(c, 1) + (c.keyword ? " · 키워드 " + esc(c.keyword) : "") + (c.note ? ' <span style="color:var(--warning);">· 비고: ' + esc(c.note) + "</span>" : "") + "</div></div>" +
      '<div class="camp-row-meta">' + filled + "/" + c.recruit_count + "명" +
      (mixed ? ' <span style="color:var(--ink-faint);">(실배송 ' + realCount + "/" + c.real_delivery_target + " · 빈박스 " + emptyCount + "/" + c.empty_box_target + ")</span>" : "") +
      (pendingCount ? ' · <span class="warn-tag">정산대기 ' + pendingCount + '건</span>' : "") + "</div>" +
      '<span class="camp-row-date">등록 ' + esc(String(c.created_at || "").slice(0, 10)) + "</span>" +
      '<button class="btn btn-sm btn-primary" data-action="share-campaign" data-campaign="' + c.id + '">공유</button>' +
      '<button class="btn btn-sm" data-action="copy-share-link" data-campaign="' + c.id + '" title="공유 창이 안 뜨거나 오류가 날 때 이 버튼으로 링크만 복사하세요">링크 복사</button>' +
      '<button class="btn btn-sm" data-action="open-invoice" data-campaign="' + c.id + '">거래명세서</button>' +
      '<button class="btn btn-sm" data-action="edit-campaign" data-campaign="' + c.id + '">수정</button>' +

  // 업체 하나가 캠페인을 여러 개 동시에 맡기는 경우, 캠페인마다 따로 거래명세서를 뽑는 번거로움이
  // 있어서 여러 캠페인을 골라 한 장으로 합쳐 발행할 수 있게 한다. 캠페인이 1개여도 그대로 동작한다.
  function invoiceTitleLabel(camps) {
    if (camps.length === 1) return esc(camps[0].product) + (camps[0].option_name ? " · " + esc(camps[0].option_name) : "");
    var names = camps.map(function (c) { return c.product; });
    var shown = names.slice(0, 2).map(esc).join(", ");
    return shown + (names.length > 2 ? " 외 " + (names.length - 2) + "건" : "") + " · 총 " + camps.length + "건 통합";
  }

  function renderInvoiceModal() {
    var camps = (UI.invoiceCampaignIds || []).map(findCampaign).filter(Boolean);
    if (!camps.length) return "";
    var def = UI.invoiceDefaults || {};
    var lines = camps.reduce(function (acc, c) { return acc.concat(computeInvoiceLines(c)); }, []);
    var grandTotal = lines.reduce(function (s, l) { return s + l.total; }, 0);
    var dp = splitInvoiceDate(def.date);

    var lineRows = lines.map(function (l) {
      return (
        '<tr><td class="inv-date-y">' + esc(dp.y) + '</td><td class="inv-date-m">' + esc(dp.m) + '</td><td class="inv-date-d">' + esc(dp.d) + "</td>" +
        '<td style="text-align:left;">' + esc(l.name) + "</td>" +
        "<td>" + l.count + "</td>" +
        "<td>" + esc(l.unit) + "</td>" +
        '<td style="text-align:right;">' + l.unitPrice.toLocaleString("ko-KR") + "</td>" +
        '<td style="text-align:right;">' + l.vat.toLocaleString("ko-KR") + "</td>" +
        '<td style="text-align:right;">' + l.total.toLocaleString("ko-KR") + "</td>" +
        "<td></td></tr>"
      );
    }).join("");
    var emptyRow = '<tr><td class="inv-date-y"></td><td class="inv-date-m"></td><td class="inv-date-d"></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>';
    for (var i = lines.length; i < 6; i++) lineRows += emptyRow;

    return (
      '<div class="modal-backdrop invoice-overlay" data-action="close-invoice">' +
      '<div class="invoice-dialog" data-action="noop">' +
      '<h2 style="margin-bottom:14px;">거래명세서 · ' + invoiceTitleLabel(camps) + "</h2>" +
      '<div class="invoice-form-grid">' +
      '<div class="field"><label>공급자 상호(회사명)</label><input id="inv-input-name" list="client-name-list" value="' + esc(def.name || "") + '" placeholder="예: 픽더프레시"></div>' +
      '<div class="field"><label>공급자 등록번호</label><input id="inv-input-reg" value="' + esc(def.reg || "") + '" placeholder="000-00-00000"></div>' +
      '<div class="field"><label>공급자 대표자명</label><input id="inv-input-ceo" value="' + esc(def.ceo || "") + '"></div>' +
      '<div class="field"><label>공급자 이메일</label><input id="inv-input-email" value="' + esc(def.email || "") + '"></div>' +
      '<div class="field"><label>거래일자</label><input id="inv-input-date" type="date" value="' + esc(def.date || todayISO()) + '"></div>' +
      '<div class="field" style="display:flex;align-items:flex-end;"><button type="button" class="btn btn-sm" data-action="lookup-client-fill">저장된 정보 불러오기</button></div>' +
      "</div>" +
      '<p style="font-size:.76rem;color:var(--ink-faint);margin-bottom:4px;">상호를 입력하면 예전에 저장해둔 등록번호·대표자명·이메일을 불러올 수 있어요. 다운로드하면 이번에 입력한 정보가 다음을 위해 자동으로 저장돼요.</p>' +
      '<datalist id="client-name-list">' + (DATA.clientNames || []).map(function (n) { return '<option value="' + esc(n) + '">'; }).join("") + "</datalist>" +
      '<div class="invoice-scroll"><div id="invoice-render-target" style="background:#fff;padding:28px;width:900px;box-sizing:content-box;">' +
      '<div class="invoice-wrap">' +
      '<div class="invoice-title">거 래 명 세 표</div>' +
      '<table class="invoice-table">' +
      '<colgroup><col style="width:6%"><col style="width:14%"><col style="width:30%"><col style="width:6%"><col style="width:14%"><col style="width:30%"></colgroup>' +
      "<tr>" +
      '<td class="vert" rowspan="4">공급받는자</td><td class="lbl">등록번호</td><td class="val-strong">' + esc(OUR_COMPANY.reg) + "</td>" +
      '<td class="vert" rowspan="4">공급자</td><td class="lbl">등록번호</td><td class="val-strong" id="inv-reg">' + esc(def.reg || "") + "</td>" +
      "</tr>" +
      '<tr><td class="lbl">상호(법인명)</td><td class="val">' + esc(OUR_COMPANY.name) + "</td>" +
      '<td class="lbl">상호(법인명)</td><td class="val" id="inv-name">' + esc(def.name || "") + "</td></tr>" +
      '<tr><td class="lbl">대표자명</td><td class="val">' + esc(OUR_COMPANY.ceo) + "</td>" +
      '<td class="lbl">대표자명</td><td class="val" id="inv-ceo">' + esc(def.ceo || "") + "</td></tr>" +
      '<tr><td class="lbl">계좌번호</td><td class="val">' + esc(OUR_COMPANY.account) + "</td>" +
      '<td class="lbl">이메일 주소</td><td class="val" id="inv-email">' + esc(def.email || "") + "</td></tr>" +
      "</table>" +
      '<table class="invoice-table">' +
      '<colgroup><col style="width:5%"><col style="width:5%"><col style="width:5%"><col style="width:29%"><col style="width:8%"><col style="width:7%"><col style="width:12%"><col style="width:10%"><col style="width:12%"><col style="width:7%"></colgroup>' +
      '<tr class="hd"><td>년</td><td>월</td><td>일</td><td>품 목</td><td>수량</td><td>단위</td><td>공급가액</td><td>세액</td><td>합계</td><td>비고</td></tr>' +
      lineRows +
      "</table>" +
      '<table class="invoice-table">' +
      '<colgroup><col style="width:10%"><col style="width:20%"><col style="width:4%"><col style="width:10%"><col style="width:20%"><col style="width:4%"><col style="width:14%"><col style="width:18%"></colgroup>' +
      "<tr>" +
      '<td class="lbl">인수자</td><td></td><td>인</td>' +
      '<td class="lbl">납품자</td><td></td><td>인</td>' +
      '<td class="lbl">합계 금액</td><td class="val-strong">' + grandTotal.toLocaleString("ko-KR") + "원</td>" +
      "</tr></table>" +
      "</div></div></div>" +

      '<button type="button" class="btn" data-action="close-invoice">닫기</button>' +

      "</div>" +
      "</div></div>"
    );

  function renderManualAddBar(c) {
    var open = UI.manualAddCampaignId === c.id;
    if (!open) {
      return '<div style="margin:12px 0;"><button class="btn btn-sm" data-action="open-manual-add" data-campaign="' + c.id + '">+ 신청자 직접 추가 (마감된 캠페인용)</button></div>';

      '<div class="card" style="padding:16px;margin:12px 0;">' +

      '<p style="font-size:.8rem;color:var(--ink-faint);margin-bottom:12px;">마감돼서 신청 페이지로 접수를 못 받은 분을 관리자가 대신 등록할 때 써요. 주문번호를 이미 알고 있으면 같이 입력해주세요(없으면 배정확정 상태로 등록돼요).</p>' +

      '<div class="field"><label>은행</label><input name="bank" required></div>' +

      '<div class="field"><label>신청 수량</label><input name="quantity" type="number" min="1" value="1" required></div>' +
      (isMixedDelivery(c)
        ? '<div class="field"><label>배송 방식</label><select name="deliveryType" required><option value="real">실배송</option><option value="empty">빈박스</option></select></div>'

      '<div class="field"><label>주문번호 <span style="font-weight:400;color:var(--ink-faint);">(선택 · 이미 구매했으면 입력)</span></label><input name="orderNumber" inputmode="numeric" placeholder="아직 없으면 비워두세요"></div>' +

    );

  function sortArrow(field) {
    if (UI.campSortField !== field) return '<span style="opacity:.35;font-size:.75em;">↕</span>';
    return '<span style="font-size:.75em;">' + (UI.campSortDir === "asc" ? "▲" : "▼") + "</span>";
  }

  function sortedApplicants(list) {
    if (!UI.campSortField) return list;
    var field = UI.campSortField;
    var dir = UI.campSortDir === "desc" ? -1 : 1;
    return list.slice().sort(function (a, b) {
      var av = field === "name" ? (a.name || "") : (a.applied_at || "");
      var bv = field === "name" ? (b.name || "") : (b.applied_at || "");
      if (av < bv) return -1 * dir;
      if (av > bv) return 1 * dir;
      return 0;
    });
  }

  function renderCampDetail(c) {
    var list = c.applicants || [];
    if (!list.length) return '<div class="camp-detail">' + renderManualAddBar(c) + '<div class="empty">아직 신청자가 없어요.</div></div>';
    var closed = !campaignIsOpen(c);
    var pending = list.filter(isSettleEligible);
    var rows = sortedApplicants(list).map(function (a, idx) {
      var stuck = closed && a.status === "assigned";
      var eligible = isSettleEligible(a);
      var checked = eligible ? (UI.settleChecked[a.id] !== false) : (UI.settleChecked[a.id] === true);
      return (
        "<tr><td><input type=\"checkbox\" data-action=\"settle-check\" data-applicant=\"" + a.id + "\" " + (checked ? "checked" : "") + "></td>" +
        '<td class="num" style="color:var(--ink-faint);">' + (idx + 1) + "</td>" +
        "<td>" + esc(a.name) + ((a.quantity || 1) > 1 ? ' <span style="color:var(--accent);font-weight:600;">· ' + a.quantity + "개</span>" : "") + (a.delivery_type ? ' <span class="pill pill-closed" style="font-size:.68rem;">' + deliveryTypeLabel(a.delivery_type) + "</span>" : "") + (stuck ? ' <span class="warn-tag">· 미구매</span>' : "") + "</td>" +
        '<td style="max-width:220px;white-space:normal;font-size:.85rem;">' + esc(a.address) + "</td>" +
        '<td class="num">' + esc(a.phone) + "</td>" +
        '<td class="num">' + esc(a.order_number || "—") + "</td>" +
        "<td>" + esc(a.bank) + " " + esc(a.account) + "</td>" +
        '<td class="num" style="white-space:nowrap;font-size:.8rem;color:var(--ink-soft);">' + esc(fmtAppliedAt(a.applied_at)) +
        (a.purchased_at ? '<div style="color:var(--ink-faint);font-size:.74rem;margin-top:3px;">주문 ' + esc(fmtAppliedAt(a.purchased_at)) + "</div>" : "") +
        "</td>" +
        '<td><span class="pill pill-' + a.status + '">' + STATUS_LABEL[a.status] + "</span>" +
        (a.exported ? ' <span class="pill pill-reviewed">파일 생성됨</span>' : "") +
        (a.status === "paid" && a.paid_at ? '<div style="font-size:.74rem;color:var(--ink-faint);margin-top:3px;">' + esc(fmtDateTime(a.paid_at)) + "</div>" : "") +
        "</td>" +
        '<td>' + (eligible || a.status === "paid" ? renderProofControl(a) : "") + "</td>" +

  function renderProofControl(a) {
    if (a.transfer_proof_path) {
      return '<button type="button" class="btn btn-sm" data-action="view-transfer-proof" data-path="' + esc(a.transfer_proof_path) + '">증빙 보기</button>';

  function attachTransferProofBatch(campaignId, file) {
    if (!file || !file.size) return;
    var camp = findCampaign(campaignId);
    if (!camp) return;
    var pending = (camp.applicants || []).filter(isSettleEligible);
    var selected = pending.filter(function (a) { return UI.settleChecked[a.id] !== false; });
    if (!selected.length) { toast("선택된 항목이 없어요. 체크박스로 먼저 선택해주세요.", "warn"); return; }
    var ext = ((file.name || "").split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg";
    var path = campaignId + "/" + Date.now() + "_" + Math.random().toString(36).slice(2, 8) + "." + ext;
    setBusy(true);
    sb.storage.from("transfer-proofs").upload(path, file).then(function (res) {
      if (res.error) { setBusy(false); toast(res.error.message || "증빙 업로드에 실패했어요.", "err"); return null; }
      var ids = selected.map(function (a) { return a.id; });
      return sb.from("applicants").update({ transfer_proof_path: path }).in("id", ids);
    }).then(function (res2) {
      setBusy(false);
      if (!res2) return;
      if (res2.error) { toast(res2.error.message || "증빙 저장에 실패했어요.", "err"); return; }
      toast(selected.length + "건에 이체 증빙을 첨부했어요.");
      loadAdminData();
    }).catch(function (err) {
      setBusy(false);
      toast((err && err.message) || "증빙 업로드에 실패했어요.", "err");
    });
  }

  function viewTransferProof(path) {
    if (!path) return;
    sb.storage.from("transfer-proofs").createSignedUrl(path, 60).then(function (res) {
      if (res.error || !res.data) { toast("증빙 파일을 불러오지 못했어요.", "err"); return; }
      window.open(res.data.signedUrl, "_blank", "noopener");
    });
  }

  function bounceNonAdmin() {
    // 로그인은 됐지만 admins 테이블에 없는 계정 — 관리자 화면을 보여줄 필요 없이
    // 조용히 로그아웃시키고 참여자 화면으로 돌려보낸다.
    DATA.loadingAdmin = false;
    DATA.isAdmin = false;
    DATA.adminCampaigns = [];
    sb.auth.signOut().then(function () {
      UI.adminSession = null;
      UI.role = "participant"; saveRole();
      UI.accessDeniedNotice = true;
      render();
    });
  }
  function loadAdminData() {
    DATA.loadingAdmin = true;
    render();
    var uid = UI.adminSession && UI.adminSession.user && UI.adminSession.user.id;
    if (!uid) { bounceNonAdmin(); return; }
    // RLS는 권한이 없어도 에러 대신 "0건"을 정상 응답으로 돌려주므로,
    // 캠페인 데이터를 바로 불러오기 전에 admins 테이블에 실제로 등록돼 있는지부터 확인한다.
    sb.from("admins").select("user_id").eq("user_id", uid).maybeSingle().then(function (adminRes) {
      if (adminRes.error || !adminRes.data) { bounceNonAdmin(); return; }
      sb.from("campaigns").select("*, applicants(*)").order("created_at", { ascending: false }).then(function (res) {
        DATA.loadingAdmin = false;
        if (res.error) { bounceNonAdmin(); return; }
        DATA.isAdmin = true;
        DATA.adminCampaigns = res.data || [];
        render();
        loadClients();
      });
    });
  }

  function uploadCampaignImage(file) {
    if (!file || !file.size) return Promise.resolve(null);
    var extMatch = /\.([a-zA-Z0-9]+)$/.exec(file.name || "");
    var ext = (extMatch ? extMatch[1] : "jpg").toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg";
    var path = Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "." + ext;
    return sb.storage.from("campaign-images").upload(path, file, { cacheControl: "3600", upsert: false }).then(function (res) {
      if (res.error) throw new Error(res.error.message || "이미지 업로드에 실패했어요.");
      var pub = sb.storage.from("campaign-images").getPublicUrl(path);
      return (pub.data && pub.data.publicUrl) || null;
    });
  }

  // 빈박스/실배송을 함께 운영하는 캠페인이면 두 목표 인원의 합으로 모집 인원을 정하고,
  // 아니면 기존처럼 관리자가 입력한 모집 인원을 그대로 쓴다.
  function deliveryFieldsFrom(data) {
    if (data.mixed) {
      var real = Math.max(0, Number(data.realTarget) || 0);
      var empty = Math.max(0, Number(data.emptyTarget) || 0);
      return { real_delivery_target: real, empty_box_target: empty, recruit_count: Math.max(1, real + empty) };
    }
    return { real_delivery_target: 0, empty_box_target: 0, recruit_count: Math.max(1, Number(data.recruitCount) || 1) };
  }

  function createCampaign(data) {
    setBusy(true);
    var qtyPrices = data.qtyPrices || [];
    var dlv = deliveryFieldsFrom(data);
    uploadCampaignImage(data.imageFile).then(function (imageUrl) {
      return sb.from("campaigns").insert({
        seller: data.seller, product: data.product, option_name: (data.optionName || "").trim() || null,
        keyword: (data.keyword || "").trim() || null,
        unit_price: qtyPrices[0] || 0, fee: unformatMoney(data.fee),
        quantity_prices: qtyPrices,
        note: (data.note || "").trim() || null,
        max_quantity: Math.max(1, qtyPrices.length || 1),
        recruit_count: dlv.recruit_count, deadline: data.deadline || defaultFarDeadline(),
        real_delivery_target: dlv.real_delivery_target, empty_box_target: dlv.empty_box_target,
        image_url: imageUrl
      }).select().single();
    }).then(function (res) {
      setBusy(false);
      if (res.error) { toast(res.error.message || "등록 실패", "err"); return; }
      UI.showNewCampaign = false;
      toast("캠페인이 등록됐어요.");
      if (res.data) notifyNewCampaign(res.data);
      loadAdminData();
    }).catch(function (err) {
      setBusy(false);
      toast((err && err.message) || "이미지 업로드에 실패했어요.", "err");
    });
  }

  // 새 캠페인이 등록되면 구독해둔 참여자들에게 푸시 알림을 보낸다. (실패해도 캠페인 등록 자체는 이미 끝난 뒤라 조용히 무시)

          url: buildShareUrl(c)
        })
      }).catch(function () {});
    } catch (e) {}
  }

  function safeFileName(s) {
    return String(s || "").replace(/[\\/:*?"<>|]/g, " ").replace(/\s+/g, " ").trim();
  }

  function downloadTransferFile(pending) {
    var selected = pending.filter(function (a) { return UI.settleChecked[a.id] !== false; });
    if (!selected.length) { toast("선택된 항목이 없어요.", "warn"); return; }
    var batches = [];
    for (var i = 0; i < selected.length; i += 15) batches.push(selected.slice(i, i + 15));
    var productName = safeFileName((selected[0].campaign && selected[0].campaign.product) || "정산") || "정산";
    batches.forEach(function (batch, idx) {
      var rows = batch.map(function (a) {

  function formatPhone(v) {
    var digits = String(v || "").replace(/\D/g, "").slice(0, 11);
    var p1 = digits.slice(0, 3), p2 = digits.slice(3, 7), p3 = digits.slice(7, 11);
    var out = p1;
    if (p2) out += "-" + p2;
    if (p3) out += "-" + p3;
    return out;
  }
  function formatMoney(v) {
    var digits = String(v || "").replace(/\D/g, "").replace(/^0+(?=\d)/, "");
    if (!digits) return "";
    return Number(digits).toLocaleString("ko-KR");
  }
  function unformatMoney(v) {
    return Number(String(v || "").replace(/[^\d]/g, "")) || 0;
  }

      if (t.id === "ap-phone") maybeAutoLoadProfile(t);
    } else if (t && (t.id === "ap-account" || t.id === "edit-account")) {
      t.value = t.value.replace(/\D/g, "");
    } else if (t && t.classList && t.classList.contains("qty-price-input")) {
      t.value = formatMoney(t.value);
    } else if (t && t.id && t.id.indexOf("inv-input-") === 0) {
      syncInvoicePreview();

      if (t.id === "inv-input-name" && DATA.clientNames && DATA.clientNames.indexOf(t.value.trim()) !== -1) {
        lookupClientAndFill(t.value.trim());
      }
    } else if (t && (t.id === "camp-search" || t.id === "ledger-search")) {
      // 검색 결과 영역(#camp-list-results / #ledger-results)만 갈아끼우고, 입력창(input) 자체는
      // 절대 다시 그리지 않는다. 한글은 자음/모음이 조합돼서 완성되는데, 조합 중에 input의
      // DOM을 다시 만들면(예전엔 render()로 전체를 다시 그렸음) 그 조합이 깨져서 낱자로
      // 따로따로 입력돼버렸다. 입력창을 안 건드리니 글자가 완성되는 즉시(스페이스 없이도)
      // 바로 결과가 갱신된다.
      if (t.id === "camp-search") {
        UI.campSearchQuery = t.value;
        updateCampListResults();
      } else {
        UI.ledgerSearchQuery = t.value;
        updateLedgerResults();
      }
    }
  });

  // 거래명세서 입력 폼(상호/등록번호/대표자명/이메일/거래일자)의 현재 값을
  // 실제 이미지로 캡처될 미리보기 표에 그대로 반영한다.
  function syncInvoicePreview() {
    var byId = function (id) { return document.getElementById(id); };
    var setText = function (id, v) { var el = byId(id); if (el) el.textContent = v || ""; };
    var nameEl = byId("inv-input-name"), regEl = byId("inv-input-reg"), ceoEl = byId("inv-input-ceo"),
      emailEl = byId("inv-input-email"), dateEl = byId("inv-input-date");
    setText("inv-name", nameEl ? nameEl.value : "");
    setText("inv-reg", regEl ? regEl.value : "");
    setText("inv-ceo", ceoEl ? ceoEl.value : "");
    setText("inv-email", emailEl ? emailEl.value : "");
    var dp = splitInvoiceDate(dateEl ? dateEl.value : "");
    Array.prototype.forEach.call(document.querySelectorAll(".inv-date-y"), function (el) { el.textContent = dp.y; });
    Array.prototype.forEach.call(document.querySelectorAll(".inv-date-m"), function (el) { el.textContent = dp.m; });
    Array.prototype.forEach.call(document.querySelectorAll(".inv-date-d"), function (el) { el.textContent = dp.d; });
  }

  function lookupClientAndFill(name) {
    sb.from("clients").select("*").eq("name", name.trim()).maybeSingle().then(function (res) {
      if (res.error || !res.data) return;
      var regEl = document.getElementById("inv-input-reg"), ceoEl = document.getElementById("inv-input-ceo"), emailEl = document.getElementById("inv-input-email");
      if (regEl) regEl.value = res.data.reg_number || "";
      if (ceoEl) ceoEl.value = res.data.ceo_name || "";
      if (emailEl) emailEl.value = res.data.email || "";
      syncInvoicePreview();
    });
  }

  // 이번에 입력한 공급자 정보를 상호명 기준으로 저장해둬서, 다음에 같은 상호를 입력하면 자동으로 불러올 수 있게 한다.
  function saveClientInfo() {
    var nameEl = document.getElementById("inv-input-name");
    var name = nameEl && nameEl.value.trim();
    if (!name) return;
    var regEl = document.getElementById("inv-input-reg"), ceoEl = document.getElementById("inv-input-ceo"), emailEl = document.getElementById("inv-input-email");
    sb.from("clients").upsert({
      name: name,
      reg_number: (regEl && regEl.value.trim()) || null,
      ceo_name: (ceoEl && ceoEl.value.trim()) || null,
      email: (emailEl && emailEl.value.trim()) || null,
      updated_at: new Date().toISOString()
    }, { onConflict: "name" }).then(function (res) {
      if (!res.error) loadClients();
    });
  }

  function downloadInvoiceImage() {
    var camps = (UI.invoiceCampaignIds || []).map(findCampaign).filter(Boolean);
    if (!camps.length) return;
    if (typeof html2canvas === "undefined") { toast("이미지 생성 기능을 불러오지 못했어요. 새로고침 후 다시 시도해주세요.", "err"); return; }
    syncInvoicePreview();
    var node = document.getElementById("invoice-render-target");
    if (!node) return;
    setBusy(true);
    // 모달 안(overflow-x:auto인 스크롤 영역, position:fixed인 배경 등)에 있는 걸 그대로 캡처하면
    // 브라우저/환경에 따라 화면에 지금 안 보이는(스크롤해야 보이는) 오른쪽이 잘려서 캡처되는 경우가
    // 있었다. 그래서 캡처 직전에 내용을 그대로 복제해서 그런 제약이 전혀 없는 화면 밖의 임시
    // 컨테이너에 붙여넣고, 그 사본만 따로 캡처한다 — 부모 요소의 스크롤/overflow/포지션에
    // 전혀 영향을 안 받아서 항상 표 전체가 다 담긴다.
    var clone = node.cloneNode(true);
    clone.removeAttribute("id");
    var offscreen = document.createElement("div");
    offscreen.style.cssText = "position:absolute;left:-99999px;top:0;background:#fff;";
    offscreen.appendChild(clone);
    document.body.appendChild(offscreen);
    html2canvas(clone, { scale: 2, backgroundColor: "#ffffff" }).then(function (canvas) {
      if (offscreen.parentNode) document.body.removeChild(offscreen);
      canvas.toBlob(function (blob) {
        setBusy(false);
        if (!blob) { toast("이미지 생성에 실패했어요.", "err"); return; }
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        var nameEl = document.getElementById("inv-input-name");
        var clientName = safeFileName((nameEl && nameEl.value) || camps[0].seller || "거래처");
        var productLabel = camps.length === 1 ? camps[0].product : (camps.length + "개캠페인");
        a.href = url;
        a.download = todayISO().replace(/-/g, "") + "_" + safeFileName(productLabel) + "_" + clientName + "_거래명세서.png";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
        toast("거래명세서 이미지를 다운로드했어요.");
      });
    }).catch(function (err) {
      if (offscreen.parentNode) document.body.removeChild(offscreen);
      setBusy(false);
      toast((err && err.message) || "이미지 생성에 실패했어요.", "err");
    });
    saveClientInfo();
  }

  function maybeAutoLoadProfile(phoneInput) {
    // 연락처를 11자리까지 다 입력하면, 같은 번호로 예전에 신청했던 이름/주소/은행/계좌를
    // 자동으로 불러와 채워준다. 매번 재조회하지 않도록 같은 번호는 한 번만 시도한다.
    var digits = phoneInput.value.replace(/\D/g, "");
    if (digits.length !== 11) return;
    if (UI.profileLookupPhone === phoneInput.value) return;
    UI.profileLookupPhone = phoneInput.value;
    sb.rpc("my_last_profile", { p_phone: phoneInput.value }).then(function (res) {
      if (res.error || !res.data || !res.data.length) return;
      var p = res.data[0];
      var form = phoneInput.closest("form");
      if (!form) return;
      if (p.name && form.elements.name) form.elements.name.value = p.name;
      if (p.address && form.elements.address) form.elements.address.value = p.address;
      if (p.bank && form.elements.bank) form.elements.bank.value = p.bank;
      if (p.account && form.elements.account) form.elements.account.value = p.account;
      toast("이전에 신청하셨던 정보를 불러왔어요. 확인 후 제출해주세요.");
    });
  }

  document.addEventListener("submit", function (e) {
    var form = e.target.closest("[data-action]");
    if (!form) return;
    e.preventDefault();
    var action = form.getAttribute("data-action");
    var fd = new FormData(form);
    if (action === "apply-form") {
      applyToCampaign(form.getAttribute("data-campaign"), {
        name: fd.get("name"), phone: fd.get("phone"), address: fd.get("address"),
        bank: fd.get("bank"), account: fd.get("account"), quantity: fd.get("quantity")
      });
    } else if (action === "lookup-form") {
      var phone = document.getElementById("lookup-phone").value.trim();
      doLookup(phone);
    } else if (action === "submit-order") {
      var phoneEl = document.getElementById("lookup-phone");
      submitOrderNumber(form.getAttribute("data-applicant"), phoneEl.value.trim(), fd.get("orderNumber"));
    } else if (action === "login-form") {
      doLogin(document.getElementById("login-email").value.trim(), document.getElementById("login-password").value);
    } else if (action === "create-campaign-form") {
      var ncPrices = Array.prototype.map.call(form.querySelectorAll(".qty-price-input"), function (el) { return unformatMoney(el.value); });
      var ncMixed = !!(document.getElementById("nc-mixed-toggle") && document.getElementById("nc-mixed-toggle").checked);
      if (ncMixed && (Number(fd.get("realTarget")) || 0) + (Number(fd.get("emptyTarget")) || 0) < 1) {
        toast("실배송/빈박스 목표 인원을 합쳐서 1명 이상 입력해주세요.", "warn"); return;
      }
      if (!ncMixed && (!fd.get("recruitCount") || Number(fd.get("recruitCount")) < 1)) {
        toast("모집 인원을 입력해주세요.", "warn"); return;
      }
      createCampaign({
        seller: fd.get("seller"), product: fd.get("product"), optionName: fd.get("optionName"), keyword: fd.get("keyword"),
        qtyPrices: ncPrices,
        fee: fd.get("fee"), note: fd.get("note"), recruitCount: fd.get("recruitCount"), deadline: fd.get("deadline"), imageFile: fd.get("image"),
        mixed: ncMixed, realTarget: fd.get("realTarget"), emptyTarget: fd.get("emptyTarget")
      });
    } else if (action === "edit-campaign-form") {
      var ecPrices = Array.prototype.map.call(form.querySelectorAll(".qty-price-input"), function (el) { return unformatMoney(el.value); });
      var ecMixed = !!(document.getElementById("ec-mixed-toggle") && document.getElementById("ec-mixed-toggle").checked);
      if (ecMixed && (Number(fd.get("realTarget")) || 0) + (Number(fd.get("emptyTarget")) || 0) < 1) {
        toast("실배송/빈박스 목표 인원을 합쳐서 1명 이상 입력해주세요.", "warn"); return;
      }
      if (!ecMixed && (!fd.get("recruitCount") || Number(fd.get("recruitCount")) < 1)) {
        toast("모집 인원을 입력해주세요.", "warn"); return;
      }
      updateCampaign(form.getAttribute("data-campaign"), {
        seller: fd.get("seller"), product: fd.get("product"), optionName: fd.get("optionName"), keyword: fd.get("keyword"),
        qtyPrices: ecPrices,
        fee: fd.get("fee"), note: fd.get("note"), recruitCount: fd.get("recruitCount"), imageFile: fd.get("image"),
        mixed: ecMixed, realTarget: fd.get("realTarget"), emptyTarget: fd.get("emptyTarget")
      });
    } else if (action === "manual-add-form") {
      addApplicantManually(form.getAttribute("data-campaign"), {
        name: fd.get("name"), phone: fd.get("phone"), address: fd.get("address"),
        bank: fd.get("bank"), account: fd.get("account"), quantity: fd.get("quantity"), orderNumber: fd.get("orderNumber"),
        deliveryType: fd.get("deliveryType") || null
      });
    } else if (action === "client-form") {
      saveClientForm(form);
    } else if (action === "update-info-form") {
      var phoneEl4 = document.getElementById("lookup-phone");
      updateApplicantInfo(form.getAttribute("data-applicant"), phoneEl4.value.trim(), (fd.get("phone") || "").trim(), {
        name: fd.get("name"), address: fd.get("address"), bank: fd.get("bank"), account: fd.get("account"), quantity: fd.get("quantity")
      });
    }
  });

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast("복사했어요."); }, function () { toast("복사에 실패했어요.", "err"); });
    } else { toast("이 브라우저에서는 복사를 지원하지 않아요.", "err"); }
  }

  function buildShareUrl(c) {
    // 실제 배포 주소(https)에서는 /api/share를 통해 카톡 공유 미리보기(이미지·제목)까지 붙는 링크를 쓰고,
    // 로컬 파일로 열어서 테스트 중일 때는 그냥 참여자 화면으로 바로 연결되는 링크를 만든다.
    if (location.protocol === "https:" || location.protocol === "http:") {
      // 카톡 등 메신저는 같은 URL의 미리보기(이미지·가격 등)를 한 번 캐시해두고 계속 재사용한다.
      // 캠페인 정보(금액 등)가 바뀔 때마다 updated_at 값을 붙여 URL을 살짝 다르게 만들어서
      // 새로 공유할 때는 항상 최신 미리보기가 뜨게 한다.
      var v = String(c.updated_at || c.created_at || "").replace(/\D/g, "").slice(0, 14) || "1";
      return location.origin + "/api/share?id=" + encodeURIComponent(c.id) + "&v=" + v;
    }
    return location.href.split("?")[0].split("#")[0] + "?c=" + encodeURIComponent(c.id);
  }

  function shareCampaign(c) {
    var url = buildShareUrl(c);
    var title = c.product + (c.option_name ? " (" + c.option_name + ")" : "");
    if (navigator.share) {
      navigator.share({ title: title, text: title + "\n체험단에 참여해주세요!", url: url }).catch(function () {});
    } else {
      copyText(url);
    }
  }

  function isKakaoInAppBrowser() {
    return /KAKAOTALK/i.test(navigator.userAgent || "");
  }
  function isIOSDevice() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent || "") && !window.MSStream;
  }
  function isStandalonePwa() {
    try {
      return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
    } catch (e) { return false; }
  }

  function enablePush() {
    if (isKakaoInAppBrowser()) {
      toast("카카오톡 안에서는 알림을 켤 수 없어요. 오른쪽 위 '···' 메뉴에서 'Safari(또는 Chrome)로 열기'를 선택해주세요.", "warn");
      return;
    }
    if (isIOSDevice() && !isStandalonePwa()) {
      toast("아이폰에서는 먼저 '홈 화면에 추가'로 앱을 설치한 뒤, 그 앱에서 눌러야 알림이 켜져요.", "warn");
      return;
    }
    if (!("Notification" in window) || !("serviceWorker" in navigator)) {
      toast("이 브라우저에서는 알림 기능을 지원하지 않아요.", "warn");
      return;
    }
    if (typeof OneSignalDeferred === "undefined") {
      toast("알림 기능을 아직 불러오는 중이에요. 잠시 후 다시 눌러주세요.", "warn");
      return;
    }
    var settled = false;
    var timer = setTimeout(function () {
      if (settled) return;
      settled = true;
      toast("이 브라우저에서는 알림을 켤 수 없는 것 같아요. Safari나 Chrome 앱에서 열어서 다시 시도해주세요.", "warn");
    }, 6000);
    OneSignalDeferred.push(function (OneSignal) {
      OneSignal.Notifications.requestPermission().then(function (granted) {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        if (granted) toast("알림을 켰어요! 새 체험단이 올라오면 알려드릴게요.");
        else toast("알림이 꺼져있어요. 브라우저/기기 알림 설정에서 허용해주세요.", "warn");
      }).catch(function () {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        toast("알림을 켜지 못했어요.", "err");
      });
    });
  }

  /* ================= INIT ================= */
  render();
  sb.auth.getSession().then(function (res) {
    if (res.data && res.data.session) { UI.adminSession = res.data.session; if (UI.role === "admin") loadAdminData(); }
  });
  loadParticipantData();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
